<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Volvemos en breve — SolyLluvia</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #f0f0f0;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e3e3e3;
    border-radius: 14px;
    max-width: 460px;
    width: 100%;
    padding: 36px 28px;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }
  p { color: #5f5f5f; font-size: 15px; }
  p + p { margin-top: 10px; }
  .marca {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #e3e3e3;
    color: #9a9a9a;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h1>Volvemos en breve</h1>
    <p>Esta página está temporalmente en mantenimiento.</p>
    <p>Tu revisión guardada no se ha perdido — estará ahí cuando vuelvas.</p>
    <p class="marca">Zivug</p>
  </div>
</div>

</body>
</html>
